name: glyphora_workspace
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - apps/app
  - apps/studio
  - apps/web
  - apps/admin
  - apps/review
  - packages/backend_client
  - packages/subtitle_editor
  - packages/web_l10n
  - packages/nom_converter
  - server/backend_server
  
dependencies:
  serverpod_auth_core_client: 3.4.11
dev_dependencies:
  melos: ^8.2.2
# Glyphora Melos task runner v1
melos:
  command:
    run:
      noSelect: true

  scripts:
    dev:
      description: Run Glyphora Web and Studio with compact output.
      run: dart run tool/dev.dart
      stdio: inherit
    dev:all:
      description: Run Web, Studio, Admin, and Review together.
      exec:
        command: dart run "$MELOS_ROOT_PATH/tool/melos_jaspr_dev.dart"
        concurrency: 4
        failFast: true
      packageFilters:
        scope:
          - glyphora_web
          - glyphora_studio
          - glyphora_admin
          - glyphora_review

    dev:stop:
      description: Stop leftover Glyphora local dev servers on ports 8081-8084.
      run: dart run tool/melos_stop_dev.dart
    dev:web:
      description: Run the public Jaspr web client on port 8084.
      run: cd apps/web && jaspr serve --port 8084
      stdio: inherit

    dev:studio:
      description: Run Glyphora Studio on port 8083.
      run: cd apps/studio && jaspr serve --port 8083
      stdio: inherit

    dev:admin:
      description: Run Glyphora Admin on port 8082.
      run: cd apps/admin && jaspr serve --port 8082
      stdio: inherit

    dev:review:
      description: Run Glyphora Review on port 8081.
      run: cd apps/review && jaspr serve --port 8081
      stdio: inherit

    analyze:
      description: Analyze lib/ in every workspace package.
      exec:
        command: dart analyze lib
        concurrency: 4
        failFast: false
      packageFilters:
        dirExists:
          - lib

    format:
      description: Format lib/ in every workspace package.
      exec:
        command: dart format lib
        concurrency: 4
        failFast: false
      packageFilters:
        dirExists:
          - lib

    test:
      description: Run Dart or Flutter tests in packages that have test/.
      exec:
        command: dart run "$MELOS_ROOT_PATH/tool/melos_test.dart"
        concurrency: 2
        failFast: false
      packageFilters:
        dirExists:
          - test

    build:web:
      description: Build the public Jaspr web client.
      run: cd apps/web && jaspr build

    build:studio:
      description: Build Glyphora Studio.
      run: cd apps/studio && jaspr build

    build:admin:
      description: Build Glyphora Admin.
      run: cd apps/admin && jaspr build

    build:review:
      description: Build Glyphora Review.
      run: cd apps/review && jaspr build
