class: Video
table: video

fields:
  authorId: String
  authorName: String

  # Creator-defined series. Null only for legacy videos created before series existed.
  seriesTitle: String?

  # Real series relation. seriesTitle remains temporarily for legacy clients.
  seriesId: int?

  # Explicit episode order inside a series.
  seriesPosition: int?
  title: String
  description: String
  category: String

  # Distinguishes long-form videos from short-form content. Existing rows are
  # backfilled as regular videos by the database migration default.
  contentType: VideoContentType, default=video

  # Spoken language detected/confirmed for ASR.
  # Old videos may remain null.
  languageCode: String?

  tags: List<String>

  videoStorageKey: String
  coverStorageKey: String?

  hlsManifestStorageKey: String?
  transcoderJobName: String?
  transcodeState: String?
  durationSeconds: int

  viewCount: int
  engagedViewCount: int, default=0
  likeCount: int, default=0
  favoriteCount: int, default=0
  commentCount: int, default=0

  status: VideoStatus, default=uploading
  isPublic: bool, default=true

  publishedAt: DateTime?
  createdAt: DateTime
  updatedAt: DateTime
