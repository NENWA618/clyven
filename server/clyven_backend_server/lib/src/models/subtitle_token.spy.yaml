class: SubtitleToken
table: subtitle_token

fields:
  cueId: int, relation(parent=subtitle_cue)

  # Identifies which script representation this token belongs to.
  # Nullable for compatibility with existing subtitle rows.
  scriptCode: String?

  text: String
  normalizedText: String?

  # Optional resolved dictionary entry.
  # Multiple script forms can resolve to the same lexical entry.
  entryId: int?, relation(parent=dictionary_entry)

  startMs: int?
  endMs: int?

  position: int

  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now