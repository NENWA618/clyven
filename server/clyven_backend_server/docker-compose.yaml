services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: shipin_backend
      POSTGRES_PASSWORD: "Gw7q59-uj8NxLrcWluMFsOGamW0Hx0Mj"
    volumes:
      - shipin_backend_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "0fzTgCyw-PlTPrOYBQYfvL0OI0Pp1609"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: shipin_backend_test
      POSTGRES_PASSWORD: "720sE5_QxWR4hb9Q9-FgI7lgbUnFu9A2"
    volumes:
      - shipin_backend_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "ASatXm1iYIhjQz5OHDrwy5TPzL2rIGOC"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  shipin_backend_data:
  shipin_backend_test_data:
