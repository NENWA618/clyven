class: SubtitleCueDetail

fields:
  cue: SubtitleCue

  # Optional during migration. Later the endpoint will return every
  # available script representation for the same timed cue.
  texts: List<SubtitleCueText>?

  tokens: List<SubtitleToken>
  phrases: List<SubtitlePhrase>

  # Optional per-script karaoke timing. Each segment stores offsets
  # relative to cue.startMs so moving the cue keeps its internal timing.
  karaokeSegments: List<SubtitleKaraokeSegment>?