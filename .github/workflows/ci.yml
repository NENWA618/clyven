name: Clyven CI

on:
  push:
    branches:
      - main
      - refactor/clyven-branding
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Check Serverpod formatting
        working-directory: server/clyven_backend_server
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter
        working-directory: apps/clyven_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test Flutter
        working-directory: apps/clyven_app
        run: flutter test

      - name: Analyze Serverpod client
        working-directory: packages/clyven_backend_client
        run: dart analyze

      - name: Analyze Serverpod backend
        working-directory: server/clyven_backend_server
        run: dart analyze

      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli 3.4.11

      - name: Regenerate Serverpod code
        working-directory: server/clyven_backend_server
        run: serverpod generate

      - name: Verify generated protocol consistency
        run: |
          git diff --exit-code --ignore-blank-lines -- \
            packages/clyven_backend_client/lib/src/protocol \
            server/clyven_backend_server/lib/src/generated

      - name: Analyze regenerated Serverpod client
        working-directory: packages/clyven_backend_client
        run: dart analyze

      - name: Analyze regenerated Serverpod backend
        working-directory: server/clyven_backend_server
        run: dart analyze
