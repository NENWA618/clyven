name: Glyphora CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Check localization completeness
        working-directory: apps/app
        run: dart run tool/check_l10n_keys.dart

      - name: Generate Flutter localizations
        working-directory: apps/app
        run: flutter gen-l10n

      - name: Check Serverpod formatting
        working-directory: server/backend_server
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter
        working-directory: apps/app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test Flutter
        working-directory: apps/app
        run: flutter test

      - name: Analyze Serverpod client
        if: always() && !cancelled()
        working-directory: packages/backend_client
        run: dart analyze

      - name: Analyze Serverpod backend
        if: always() && !cancelled()
        working-directory: server/backend_server
        run: dart analyze

      - name: Install Serverpod CLI
        if: always() && !cancelled()
        run: dart pub global activate serverpod_cli 3.4.11

      - name: Regenerate Serverpod code
        if: always() && !cancelled()
        working-directory: server/backend_server
        run: serverpod generate

      - name: Verify generated protocol consistency
        if: always() && !cancelled()
        run: |
          git diff --exit-code --ignore-blank-lines -- \
            packages/backend_client/lib/src/protocol \
            server/backend_server/lib/src/generated

      - name: Analyze regenerated Serverpod client
        if: always() && !cancelled()
        working-directory: packages/backend_client
        run: dart analyze

      - name: Analyze regenerated Serverpod backend
        if: always() && !cancelled()
        working-directory: server/backend_server
        run: dart analyze

  cloudflare-config:
    name: Validate Cloudflare Worker bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cloudflare dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Worker configuration and bundle (no deploy)
        run: npx wrangler deploy --dry-run --outdir /tmp/glyphora-cloudflare-dry-run

  cloudflare-backfill-safety:
    name: Check migration script safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n cloudflare/migrate_gcs_to_r2.sh
      - name: Verify non-destructive modes with fake rclone
        run: |
          set -euo pipefail
          mkdir -p /tmp/glyphora-mock-bin
          cat > /tmp/glyphora-mock-bin/rclone <<'MOCK'
          #!/bin/sh
          printf '%s\n' "$*" >> "$MOCK_RCLONE_LOG"
          MOCK
          chmod +x /tmp/glyphora-mock-bin/rclone
          export PATH="/tmp/glyphora-mock-bin:$PATH"
          export MOCK_RCLONE_LOG="$RUNNER_TEMP/rclone-commands.log"
          export GLYPHORA_GCS_REMOTE='gcs:source-bucket'
          export GLYPHORA_R2_REMOTE='r2:destination-bucket'
          bash cloudflare/migrate_gcs_to_r2.sh inventory
          bash cloudflare/migrate_gcs_to_r2.sh
          if bash cloudflare/migrate_gcs_to_r2.sh copy; then
            echo 'Copy without confirmation was accepted' >&2
            exit 1
          fi
          export GLYPHORA_CONFIRM_R2_COPY=YES
          bash cloudflare/migrate_gcs_to_r2.sh copy
          bash cloudflare/migrate_gcs_to_r2.sh verify
          bash cloudflare/migrate_gcs_to_r2.sh verify-deep
          grep -q '^size gcs:source-bucket$' "$MOCK_RCLONE_LOG"
          grep -q '^size r2:destination-bucket$' "$MOCK_RCLONE_LOG"
          grep -q '^copy gcs:source-bucket r2:destination-bucket --dry-run ' "$MOCK_RCLONE_LOG"
          grep -q '^copy gcs:source-bucket r2:destination-bucket --immutable --progress ' "$MOCK_RCLONE_LOG"
          grep -q '^check gcs:source-bucket r2:destination-bucket --one-way --size-only ' "$MOCK_RCLONE_LOG"
          grep -q '^check gcs:source-bucket r2:destination-bucket --one-way --download ' "$MOCK_RCLONE_LOG"
          if GLYPHORA_R2_REMOTE='gcs:source-bucket' bash cloudflare/migrate_gcs_to_r2.sh copy; then
            echo 'Identical source and destination accepted' >&2
            exit 1
          fi
          cat > /tmp/glyphora-mock-bin/rclone <<'MOCKFAIL'
          #!/bin/sh
          if [ "$1" = 'check' ]; then
            exit 17
          fi
          exit 0
          MOCKFAIL
          chmod +x /tmp/glyphora-mock-bin/rclone
          if bash cloudflare/migrate_gcs_to_r2.sh verify; then
            echo 'Failed destination verification was accepted' >&2
            exit 1
          fi
          if bash cloudflare/migrate_gcs_to_r2.sh verify-deep; then
            echo 'Failed byte verification was accepted' >&2
            exit 1
          fi
          if GLYPHORA_R2_REMOTE='r2:' bash cloudflare/migrate_gcs_to_r2.sh copy; then
            echo 'Unsafe root-only remote accepted' >&2
            exit 1
          fi

  cloudflare-api-probe:
    name: Check staged API probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n cloudflare/smoke_api.sh
      - name: Test HTTP error handling without network access
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mockbin"
          cat > "$RUNNER_TEMP/mockbin/curl" <<'MOCK'
          #!/bin/sh
          printf '%s' "$MOCK_HTTP_STATUS"
          MOCK
          chmod +x "$RUNNER_TEMP/mockbin/curl"
          export PATH="$RUNNER_TEMP/mockbin:$PATH"
          for code in 200 204 302; do
            export MOCK_HTTP_STATUS="$code"
            bash cloudflare/smoke_api.sh https://api.example.com/
          done
          for code in 000 401 403 404 500 503; do
            export MOCK_HTTP_STATUS="$code"
            if bash cloudflare/smoke_api.sh https://api.example.com/; then
              echo "Unexpectedly accepted HTTP $code" >&2
              exit 1
            fi
          done
          if bash cloudflare/smoke_api.sh http://api.example.com/; then
            echo 'Insecure URL accepted' >&2
            exit 1
          fi

  cloudflare-container-build:
    name: Build Cloudflare Serverpod container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Cloudflare API hostname overlay
        run: bash cloudflare/test_container_entrypoint.sh
      - name: Build Cloudflare container image (no push or deploy)
        run: docker build --file Dockerfile.cloudflare --tag glyphora-cloudflare-ci:latest .
