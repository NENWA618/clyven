name: Glyphora CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Check localization completeness
        working-directory: apps/app
        run: dart run tool/check_l10n_keys.dart

      - name: Generate Flutter localizations
        working-directory: apps/app
        run: flutter gen-l10n

      - name: Format migrated Serverpod files
        working-directory: server/backend_server
        run: dart format --output=write lib/server.dart lib/src/services/video_transcode_service.dart

      - name: Commit formatter changes to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- server/backend_server/lib/server.dart server/backend_server/lib/src/services/video_transcode_service.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server/backend_server/lib/server.dart server/backend_server/lib/src/services/video_transcode_service.dart
            git commit -m "style: format Cloudflare migration Dart files"
            git push origin HEAD:main
          fi

      - name: Check Serverpod formatting
        working-directory: server/backend_server
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter
        working-directory: apps/app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test Flutter
        working-directory: apps/app
        run: flutter test

      - name: Analyze Serverpod client
        if: always() && !cancelled()
        working-directory: packages/backend_client
        run: dart analyze

      - name: Analyze Serverpod backend
        if: always() && !cancelled()
        working-directory: server/backend_server
        run: dart analyze

      - name: Install Serverpod CLI
        if: always() && !cancelled()
        run: dart pub global activate serverpod_cli 3.4.11

      - name: Regenerate Serverpod code
        if: always() && !cancelled()
        working-directory: server/backend_server
        run: serverpod generate

      - name: Verify generated protocol consistency
        if: always() && !cancelled()
        run: |
          git diff --exit-code --ignore-blank-lines -- \
            packages/backend_client/lib/src/protocol \
            server/backend_server/lib/src/generated

      - name: Analyze regenerated Serverpod client
        if: always() && !cancelled()
        working-directory: packages/backend_client
        run: dart analyze

      - name: Analyze regenerated Serverpod backend
        if: always() && !cancelled()
        working-directory: server/backend_server
        run: dart analyze
