name: Deploy Cloudflare staging (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: 'Type DEPLOY-STAGING for updates or BOOTSTRAP-STAGING for first deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: glyphora-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging Worker
    if: ${{ inputs.confirm_staging == 'DEPLOY-STAGING' || inputs.confirm_staging == 'BOOTSTRAP-STAGING' }}
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Cloudflare credentials and staging hostname
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_HOST: ${{ secrets.GLYPHORA_CLOUDFLARE_PUBLIC_HOST }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo 'Missing Cloudflare API token' >&2; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo 'Missing Cloudflare account ID' >&2; exit 1; }
          test -n "$STAGING_HOST" || { echo 'Missing staging API host' >&2; exit 1; }
          case "$STAGING_HOST" in
            *.run.app|*.googleapis.com|*.examplepod.com)
              echo 'Not a staging Cloudflare API hostname' >&2; exit 1 ;;
          esac
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Verify required Worker runtime secrets before deployment
        env:
          SERVERPOD_PASSWORD_database: ${{ secrets.STAGING_SERVERPOD_PASSWORD_database }}
          SERVERPOD_PASSWORD_serviceSecret: ${{ secrets.STAGING_SERVERPOD_PASSWORD_serviceSecret }}
          SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: ${{ secrets.STAGING_SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey }}
          SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: ${{ secrets.STAGING_SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper }}
          SERVERPOD_PASSWORD_emailSecretHashPepper: ${{ secrets.STAGING_SERVERPOD_PASSWORD_emailSecretHashPepper }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.STAGING_CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_HOST: ${{ secrets.STAGING_CLOUDFLARE_R2_PUBLIC_HOST }}
          SERVERPOD_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_SERVERPOD_R2_ACCESS_KEY_ID }}
          SERVERPOD_R2_SECRET_KEY: ${{ secrets.STAGING_SERVERPOD_R2_SECRET_KEY }}
          CLOUDFLARE_STREAM_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_STREAM_API_TOKEN }}
          GLYPHORA_CLOUDFLARE_PUBLIC_HOST: ${{ secrets.GLYPHORA_CLOUDFLARE_PUBLIC_HOST }}
          GLYPHORA_STAGING: 'true'
          GLYPHORA_STAGING_DB_HOST: ${{ secrets.GLYPHORA_STAGING_DB_HOST }}
          GLYPHORA_STAGING_DB_NAME: ${{ secrets.GLYPHORA_STAGING_DB_NAME }}
          GLYPHORA_STAGING_DB_USER: ${{ secrets.GLYPHORA_STAGING_DB_USER }}
        run: |
          set -euo pipefail
          for name in SERVERPOD_PASSWORD_database SERVERPOD_PASSWORD_serviceSecret \
            SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper SERVERPOD_PASSWORD_emailSecretHashPepper CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_R2_BUCKET CLOUDFLARE_R2_PUBLIC_HOST \
            SERVERPOD_R2_ACCESS_KEY_ID SERVERPOD_R2_SECRET_KEY \
            CLOUDFLARE_STREAM_API_TOKEN GLYPHORA_CLOUDFLARE_PUBLIC_HOST \
            GLYPHORA_STAGING_DB_HOST GLYPHORA_STAGING_DB_NAME GLYPHORA_STAGING_DB_USER; do
            test -n "${!name:-}" || { echo "Missing required runtime secret: $name" >&2; exit 1; }
          done
          test "$GLYPHORA_STAGING_DB_HOST" != 'ep-wandering-frog-azudrqv6.c-3.ap-southeast-1.aws.neon.tech' || { echo 'Production database host forbidden for staging' >&2; exit 1; }
          test "$GLYPHORA_STAGING_DB_NAME" != 'neondb' || { echo 'Production database name forbidden for staging' >&2; exit 1; }
          test "$GLYPHORA_STAGING_DB_USER" != 'neondb_owner' || { echo 'Production database user forbidden for staging' >&2; exit 1; }
      - name: Bootstrap new staging Worker without production routes
        if: ${{ inputs.confirm_staging == 'BOOTSTRAP-STAGING' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Only for FIRST deployment. Worker initially returns 503 until secrets arrive.
          # Never attach this dedicated staging Worker to production routes.
          npx wrangler deploy --name glyphora-api-staging
      - name: Configure staging Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVERPOD_PASSWORD_database: ${{ secrets.STAGING_SERVERPOD_PASSWORD_database }}
          SERVERPOD_PASSWORD_serviceSecret: ${{ secrets.STAGING_SERVERPOD_PASSWORD_serviceSecret }}
          SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: ${{ secrets.STAGING_SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey }}
          SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: ${{ secrets.STAGING_SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper }}
          SERVERPOD_PASSWORD_emailSecretHashPepper: ${{ secrets.STAGING_SERVERPOD_PASSWORD_emailSecretHashPepper }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.STAGING_CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_HOST: ${{ secrets.STAGING_CLOUDFLARE_R2_PUBLIC_HOST }}
          SERVERPOD_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_SERVERPOD_R2_ACCESS_KEY_ID }}
          SERVERPOD_R2_SECRET_KEY: ${{ secrets.STAGING_SERVERPOD_R2_SECRET_KEY }}
          CLOUDFLARE_STREAM_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_STREAM_API_TOKEN }}
          GLYPHORA_CLOUDFLARE_PUBLIC_HOST: ${{ secrets.GLYPHORA_CLOUDFLARE_PUBLIC_HOST }}
          GLYPHORA_STAGING: 'true'
          GLYPHORA_STAGING_DB_HOST: ${{ secrets.GLYPHORA_STAGING_DB_HOST }}
          GLYPHORA_STAGING_DB_NAME: ${{ secrets.GLYPHORA_STAGING_DB_NAME }}
          GLYPHORA_STAGING_DB_USER: ${{ secrets.GLYPHORA_STAGING_DB_USER }}
        run: |
          set -euo pipefail
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          python3 - "$secret_file" <<'PY'
          import json
          import os
          import sys
          fields = [
              "SERVERPOD_PASSWORD_database", "SERVERPOD_PASSWORD_serviceSecret",
              "SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey", "SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper", "SERVERPOD_PASSWORD_emailSecretHashPepper", "CLOUDFLARE_ACCOUNT_ID",
              "CLOUDFLARE_R2_BUCKET", "CLOUDFLARE_R2_PUBLIC_HOST",
              "SERVERPOD_R2_ACCESS_KEY_ID", "SERVERPOD_R2_SECRET_KEY",
              "CLOUDFLARE_STREAM_API_TOKEN", "GLYPHORA_CLOUDFLARE_PUBLIC_HOST",
              "GLYPHORA_STAGING", "GLYPHORA_STAGING_DB_HOST", "GLYPHORA_STAGING_DB_NAME", "GLYPHORA_STAGING_DB_USER",
          ]
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump({key: os.environ[key] for key in fields}, output)
          PY
          npx wrangler secret bulk "$secret_file" --name glyphora-api-staging
      - name: Deploy pre-configured staging Worker (no route or DNS changes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name glyphora-api-staging
