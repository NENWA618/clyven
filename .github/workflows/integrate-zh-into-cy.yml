name: Resolve cy zh all-features merge

on:
  push:
    branches:
      - merge/cy-zh-all-features

permissions:
  contents: write

jobs:
  resolve-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve remaining conflict logic
        run: python3 tool/merge_cy_zh_remaining.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Generate Flutter localizations
        working-directory: apps/clyven_app
        run: flutter gen-l10n

      - name: Format merged sources
        run: |
          dart format \
            apps/clyven_app/lib/core/serverpod/serverpod_client_provider.dart \
            apps/clyven_app/lib/features/video/data/repositories/serverpod_video_repository.dart \
            apps/clyven_app/lib/features/video/presentation/widgets/network_video_player.dart \
            apps/clyven_app/test/network_video_player_test.dart \
            server/clyven_backend_server/lib/src/endpoints/video_endpoint.dart \
            server/clyven_backend_server/test/integration/video_visibility_test.dart

      - name: Analyze Flutter
        working-directory: apps/clyven_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run zh regression tests on merged cy
        working-directory: apps/clyven_app
        run: |
          flutter test test/feed_account_switch_test.dart
          flutter test test/serverpod_feed_repository_test.dart
          flutter test test/network_video_player_test.dart

      - name: Analyze backend
        working-directory: server/clyven_backend_server
        run: dart analyze

      - name: Commit validated merge resolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "merge: preserve all cy and zh functionality"
          git push origin HEAD:merge/cy-zh-all-features
