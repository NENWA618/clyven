name: Resolve cy zh all-features merge

on:
  push:
    branches:
      - merge/cy-zh-all-features

permissions:
  contents: write

jobs:
  resolve-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the five conflicted files without dropping either branch's features
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # 1) Serverpod client: keep cy's ability to target a test backend via dart-define,
          # while restoring production as the default and preserving zh feed diagnostics.
          client_path = 'apps/clyven_app/lib/core/serverpod/serverpod_client_provider.dart'
          write(client_path, """import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:clyven_backend_client/clyven_backend_client.dart';
          import 'package:serverpod_auth_idp_flutter/serverpod_auth_idp_flutter.dart';
          import 'package:serverpod_flutter/serverpod_flutter.dart';

          import 'feed_diagnostics.dart';

          // 这里是这件房子的 wifi 路由器。
          final serverpodClientProvider = Provider<Client>((ref) {
            const apiUrl = String.fromEnvironment(
              'CLYVEN_API_URL',
              defaultValue: 'https://glyphora-server-11129163384.asia-southeast1.run.app/',
            );
            const revision = String.fromEnvironment(
              'CLYVEN_BUILD_REVISION',
              defaultValue: 'unset',
            );

            feedDiagnostic('FEED_CLIENT api=$apiUrl revision=$revision');

            final client = Client(apiUrl)
              ..connectivityMonitor = FlutterConnectivityMonitor()
              ..authSessionManager = FlutterAuthSessionManager();

            return client;
          });
          """)

          # 2) Video repository: preserve cy series support and add zh feed/error diagnostics.
          repo_path = 'apps/clyven_app/lib/features/video/data/repositories/serverpod_video_repository.dart'
          text = read(repo_path)
          if "../../../../core/serverpod/feed_diagnostics.dart" not in text:
              text = replace_once(
                  text,
                  "import 'package:serverpod_client/serverpod_client.dart';\n\n",
                  "import 'package:serverpod_client/serverpod_client.dart';\n\nimport '../../../../core/serverpod/feed_diagnostics.dart';\n\n",
                  'repo diagnostics import',
              )

          old = """  @override
          Future<List<VideoDetail>> loadPublishedVideos({
            VideoContentType contentType = VideoContentType.video,
          }) async {
            final videos = await client.video.getVideos(
              contentType: switch (contentType) {
                VideoContentType.video => serverpod.VideoContentType.video,
                VideoContentType.short => serverpod.VideoContentType.short,
              },
            );

            final results = <VideoDetail>[];

            for (final video in videos) {
              try {
                final detail = await _toVideoDetailWithUrls(video);

                results.add(detail);
              } catch (_) {
                // 跳过以前保存本地路径、文件已经失效等旧数据。
              }
            }

            return results;
          }
          """
          new = """  @override
          Future<List<VideoDetail>> loadPublishedVideos({
            VideoContentType contentType = VideoContentType.video,
          }) async {
            feedDiagnostic('FEED_REQUEST contentType=${contentType.name}');
            final videos = await client.video.getVideos(
              contentType: switch (contentType) {
                VideoContentType.video => serverpod.VideoContentType.video,
                VideoContentType.short => serverpod.VideoContentType.short,
              },
            );

            feedDiagnostic(
              'FEED_RESPONSE returnedCount=${videos.length} '
              'postIds=${videos.map((video) => video.id).join(',')}',
            );

            final results = <VideoDetail>[];

            for (final video in videos) {
              try {
                final detail = await _toVideoDetailWithUrls(video);
                results.add(detail);
              } on AppException catch (error) {
                feedDiagnostic(
                  'FEED_EXCLUDED postId=${video.id} reason=${error.code.name}',
                );
                if (error.code != AppErrorCode.videoUrlUnavailable) rethrow;
              } catch (error) {
                feedDiagnostic(
                  'FEED_FAILED postId=${video.id} reason=${error.runtimeType}',
                );
                rethrow;
              }
            }

            return results;
          }
          """
          text = replace_once(text, old, new, 'loadPublishedVideos')

          old = """    for (final video in userVideos) {
              try {
                final detail = await _toVideoDetailWithUrls(video);
                results.add(detail);
              } catch (_) {
                // 跳过以前保存本地文件路径的旧数据。
              }
            }
          """
          new = """    for (final video in userVideos) {
              try {
                final detail = await _toVideoDetailWithUrls(video);
                results.add(detail);
              } on AppException catch (error) {
                feedDiagnostic(
                  'USER_VIDEO_EXCLUDED postId=${video.id} reason=${error.code.name}',
                );
                if (error.code != AppErrorCode.videoUrlUnavailable) rethrow;
              }
            }
          """
          text = replace_once(text, old, new, 'loadUserVideos error handling')

          old = """    if (coverStorageKey != null && coverStorageKey.isNotEmpty) {
              final rawCoverUrl = await client.video.getVideoUrl(path: coverStorageKey);
              coverUrl = rawCoverUrl ?? '';
            }
          """
          new = """    if (coverStorageKey != null && coverStorageKey.isNotEmpty) {
              try {
                coverUrl = await client.video.getVideoUrl(path: coverStorageKey) ?? '';
              } catch (error) {
                feedDiagnostic(
                  'THUMBNAIL_UNAVAILABLE postId=${video.id} reason=${error.runtimeType}',
                );
              }
            }
          """
          text = replace_once(text, old, new, 'cover URL handling')
          write(repo_path, text)

          # 3) Video endpoint: preserve cy isPublic/series/transcoding and add zh visibility rules/logging.
          endpoint_path = 'server/clyven_backend_server/lib/src/endpoints/video_endpoint.dart'
          text = read(endpoint_path)
          text = replace_once(text, '    final now = DateTime.now();\n', '    final now = DateTime.now().toUtc();\n', 'UTC creation time')

          anchor = """    if (savedVideo.id == null) {
              throw Exception('视频创建成功，但没有取得 video id');
            }
            try {
          """
          replacement = """    if (savedVideo.id == null) {
              throw Exception('视频创建成功，但没有取得 video id');
            }

            session.log(
              'POST_CREATED postId=${savedVideo.id} ownerId=$currentUserId '
              'type=${savedVideo.contentType.name} status=${savedVideo.status.name} '
              'videoStorageKey=${savedVideo.videoStorageKey} '
              'createdAt=${savedVideo.createdAt.toIso8601String()} '
              'publishedAt=${savedVideo.publishedAt?.toIso8601String()}',
            );

            try {
          """
          text = replace_once(text, anchor, replacement, 'POST_CREATED log')

          old = """  Future<List<Video>> getVideos(
            Session session, {
            VideoContentType? contentType,
          }) async {
            return Video.db.find(
              session,
              where: contentType == null
                  ? (table) =>
                        table.isPublic.equals(true) &
                        table.status.equals(VideoStatus.published)
                  : (table) =>
                        table.isPublic.equals(true) &
                        table.status.equals(VideoStatus.published) &
                        table.contentType.equals(contentType),
              orderBy: (table) => table.createdAt,
              orderDescending: true,
            );
          }
          """
          new = """  Future<List<Video>> getVideos(
            Session session, {
            VideoContentType? contentType,
          }) async {
            final videos = await Video.db.find(
              session,
              where: contentType == null
                  ? (table) =>
                        table.isPublic.equals(true) &
                        table.status.equals(VideoStatus.published)
                  : (table) =>
                        table.isPublic.equals(true) &
                        table.status.equals(VideoStatus.published) &
                        table.contentType.equals(contentType),
              orderBy: (table) => table.createdAt,
              orderDescending: true,
            );

            session.log(
              'FEED_REQUEST viewerUserId=${session.authenticated?.userIdentifier ?? 'anonymous'} '
              'filter=isPublic:true,status:published,contentType:${contentType?.name ?? 'all'} '
              'order=createdAt:desc returnedCount=${videos.length}',
            );
            return videos;
          }
          """
          text = replace_once(text, old, new, 'getVideos visibility/logging')

          old = """  Future<Video?> getVideo(
            Session session,
            int id,
          ) async {
            final video = await Video.db.findById(session, id);

            if (video == null) {
              return null;
            }

            if (video.isPublic) {
              return video;
            }

            final currentUserId = session.authenticated?.userIdentifier.toString();
            if (currentUserId == video.authorId) {
              return video;
            }

            return null;
          }
          """
          new = """  Future<Video?> getVideo(
            Session session,
            int id,
          ) async {
            final video = await Video.db.findById(session, id);
            if (video == null) return null;

            final currentUserId = session.authenticated?.userIdentifier.toString();
            final isOwner = currentUserId == video.authorId;

            if (video.status != VideoStatus.published && !isOwner) {
              return null;
            }

            if (video.isPublic || isOwner) {
              return video;
            }

            return null;
          }
          """
          text = replace_once(text, old, new, 'getVideo combined visibility')
          write(endpoint_path, text)

          # 4) Network player: preserve cy HLS fallback + subtitle/progress controls,
          # and layer in zh timeout/retry/native-error lifecycle protection.
          player_path = 'apps/clyven_app/lib/features/video/presentation/widgets/network_video_player.dart'
          text = read(player_path)
          if "package:flutter/services.dart" not in text:
              text = replace_once(
                  text,
                  "import 'package:flutter/material.dart';\n",
                  "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n",
                  'platform services import',
              )
          if "../../../../core/serverpod/feed_diagnostics.dart" not in text:
              text = replace_once(
                  text,
                  "import 'package:video_player/video_player.dart';\n\n",
                  "import 'package:video_player/video_player.dart';\n\nimport '../../../../core/serverpod/feed_diagnostics.dart';\n",
                  'player diagnostics import',
              )

          old = """  late VideoPlayerController _controller;
            late final Future<void> _initializeFuture;
            bool _controllerCreated = false;

            final Stopwatch _fallbackClock = Stopwatch();
          """
          new = """  late VideoPlayerController _controller;
            late Future<void> _initializeFuture;
            bool _controllerCreated = false;
            final Set<VideoPlayerController> _releasedControllers = {};
            int _generation = 0;
            bool _initializationFailed = false;
            bool _reportedNativeError = false;
            Timer? _initializationTimer;
            Completer<void>? _initializationCompleter;
            String _initializationStage = 'resolve_source';

            final Stopwatch _fallbackClock = Stopwatch();
          """
          text = replace_once(text, old, new, 'player state fields')

          old = """  @override
            void initState() {
              super.initState();
              _initializeFuture = _initializePlayer();
            }

            serverpod.SubtitleCueDetail? _findActiveSubtitle(
          """
          new = """  @override
            void initState() {
              super.initState();
              _startPlayer();
            }

            void _startPlayer() {
              final generation = ++_generation;
              _initializationFailed = false;
              _reportedNativeError = false;
              _initializationStage = 'resolve_source';

              feedDiagnostic(
                'PLAYBACK_INITIALIZING postId=${widget.videoId ?? 'unknown'} '
                'host=${Uri.tryParse(widget.videoUrl)?.host ?? ''}',
              );

              final completion = Completer<void>();
              _initializationCompleter = completion;
              _initializeFuture = completion.future;
              _initializationTimer?.cancel();

              void fail(Object error, StackTrace stack) {
                if (completion.isCompleted) return;
                _initializationTimer?.cancel();
                if (mounted && generation == _generation) {
                  _initializationFailed = true;
                  final reason = error is TimeoutException
                      ? 'timeout'
                      : error is PlatformException
                      ? error.code
                      : '${error.runtimeType}';
                  feedDiagnostic(
                    'PLAYBACK_INIT_FAILED postId=${widget.videoId ?? 'unknown'} '
                    'stage=$_initializationStage reason=$reason',
                  );
                  ++_generation;
                  _releaseCurrentController();
                }
                completion.completeError(error, stack);
              }

              _initializationTimer = Timer(const Duration(seconds: 30), () {
                fail(
                  TimeoutException('Video initialization timed out'),
                  StackTrace.current,
                );
              });

              unawaited(
                _initializePlayer(generation).then((_) {
                  if (completion.isCompleted) return;
                  _initializationTimer?.cancel();
                  if (generation != _generation || _initializationFailed) {
                    return;
                  }
                  feedDiagnostic(
                    'PLAYBACK_READY postId=${widget.videoId ?? 'unknown'}',
                  );
                  completion.complete();
                }, onError: fail),
              );
            }

            bool _isGenerationActive(int generation) {
              return mounted &&
                  generation == _generation &&
                  !_initializationFailed;
            }

            void _release(VideoPlayerController controller) {
              if (!_releasedControllers.add(controller)) return;
              controller.removeListener(_handleProgress);
              if (_controllerCreated && identical(_controller, controller)) {
                _controllerCreated = false;
              }
              unawaited(
                controller.dispose().catchError((Object error) {
                  feedDiagnostic(
                    'PLAYBACK_DISPOSE_FAILED reason=${error.runtimeType}',
                  );
                }),
              );
            }

            void _releaseCurrentController() {
              if (_controllerCreated) {
                _release(_controller);
              }
            }

            void _cancelInitialization() {
              _initializationTimer?.cancel();
              final completion = _initializationCompleter;
              if (completion != null && !completion.isCompleted) {
                completion.complete();
              }
            }

            void _resetPlayer() {
              _cancelInitialization();
              ++_generation;
              _releaseCurrentController();
              _positionTicker?.cancel();
              _positionTicker = null;
              _fallbackClock
                ..stop()
                ..reset();
              _fallbackBasePosition = Duration.zero;
              _lastSavedSecond = -1;
              _startPlayer();
            }

            @override
            void didUpdateWidget(covariant NetworkVideoPlayer oldWidget) {
              super.didUpdateWidget(oldWidget);
              if (widget.videoUrl != oldWidget.videoUrl ||
                  widget.videoId != oldWidget.videoId) {
                _resetPlayer();
              }
            }

            serverpod.SubtitleCueDetail? _findActiveSubtitle(
          """
          text = replace_once(text, old, new, 'player lifecycle bootstrap')

          pattern = re.compile(r"  Future<bool> _tryInitializeSource\(String source\) async \{.*?\n  \}\n\n  Future<bool> _waitForTranscodedPlayback", re.S)
          replacement = """  Future<bool> _tryInitializeSource(
            String source,
            int generation,
          ) async {
            if (!_isGenerationActive(generation)) return false;

            final controller = _createController(source);
            _controller = controller;
            _controllerCreated = true;
            _initializationStage = 'native_initialize';

            try {
              await controller.initialize();
              if (!_isGenerationActive(generation)) {
                _release(controller);
                return false;
              }

              _initializationStage = 'set_looping';
              await controller.setLooping(false);
              if (!_isGenerationActive(generation)) {
                _release(controller);
                return false;
              }

              controller.addListener(_handleProgress);
              return true;
            } catch (error, stackTrace) {
              feedDiagnostic(
                'PLAYBACK_SOURCE_FAILED postId=${widget.videoId ?? 'unknown'} '
                'stage=$_initializationStage reason=${error.runtimeType}',
              );
              debugPrintStack(stackTrace: stackTrace);
              _release(controller);
              return false;
            }
          }

          Future<bool> _waitForTranscodedPlayback"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'_tryInitializeSource replacement count={count}')

          text = text.replace(
              "  Future<bool> _waitForTranscodedPlayback() async {\n",
              "  Future<bool> _waitForTranscodedPlayback(int generation) async {\n",
              1,
          )
          text = replace_once(
              text,
              "      if (!mounted) {\n        return false;\n      }\n",
              "      if (!_isGenerationActive(generation)) {\n        return false;\n      }\n",
              'transcode wait generation guard',
          )
          text = replace_once(
              text,
              "      if (await _tryInitializeSource(manifestUrl)) {\n",
              "      if (await _tryInitializeSource(manifestUrl, generation)) {\n",
              'transcode manifest init',
          )

          old = """  Future<void> _initializePlayer() async {
            final manifestUrl = await _fetchPlaybackManifestUrl();
            var initialized = false;

            if (manifestUrl != null) {
              initialized = await _tryInitializeSource(manifestUrl);
            }

            if (!initialized) {
              initialized = await _tryInitializeSource(widget.videoUrl);
            }

            if (!initialized) {
              initialized = await _waitForTranscodedPlayback();
            }

            if (!initialized) {
              throw StateError(
                'Neither the HLS stream nor the original video could be played.',
              );
            }

            final duration = _effectiveDuration();
            final savedPosition = widget.initialPositionSeconds;

            if (savedPosition <= 0) {
              _fallbackBasePosition = Duration.zero;
              return;
            }

            if (duration.inSeconds > 0 && savedPosition >= duration.inSeconds - 5) {
              _fallbackBasePosition = Duration.zero;
              return;
            }

            final position = Duration(seconds: savedPosition);

            _fallbackBasePosition = position;
            await _controller.seekTo(position);
          }
          """
          new = """  Future<void> _initializePlayer(int generation) async {
            final manifestUrl = await _fetchPlaybackManifestUrl();
            if (!_isGenerationActive(generation)) return;

            var initialized = false;

            if (manifestUrl != null) {
              initialized = await _tryInitializeSource(manifestUrl, generation);
            }

            if (!initialized && _isGenerationActive(generation)) {
              initialized = await _tryInitializeSource(widget.videoUrl, generation);
            }

            if (!initialized && _isGenerationActive(generation)) {
              initialized = await _waitForTranscodedPlayback(generation);
            }

            if (!_isGenerationActive(generation)) return;

            if (!initialized) {
              throw StateError(
                'Neither the HLS stream nor the original video could be played.',
              );
            }

            final duration = _effectiveDuration();
            final savedPosition = widget.initialPositionSeconds;

            if (savedPosition <= 0) {
              _fallbackBasePosition = Duration.zero;
              return;
            }

            if (duration.inSeconds > 0 && savedPosition >= duration.inSeconds - 5) {
              _fallbackBasePosition = Duration.zero;
              return;
            }

            final position = Duration(seconds: savedPosition);
            _fallbackBasePosition = position;
            _initializationStage = 'restore_position';
            await _controller.seekTo(position);
          }
          """
          text = replace_once(text, old, new, 'initialize player')

          old = """  void _handleProgress() {
            if (!_controller.value.isInitialized) {
              return;
            }
          """
          new = """  void _handleProgress() {
            if (_controller.value.hasError) {
              if (!_reportedNativeError) {
                _reportedNativeError = true;
                final description =
                    _controller.value.errorDescription?.toLowerCase() ?? '';
                final reason = description.contains('decoder')
                    ? 'decoder'
                    : description.contains('source error')
                    ? 'source'
                    : description.contains('renderer')
                    ? 'renderer'
                    : 'native';
                feedDiagnostic(
                  'PLAYBACK_NATIVE_ERROR postId=${widget.videoId ?? 'unknown'} '
                  'reason=$reason',
                );
              }
              return;
            }

            if (!_controller.value.isInitialized) {
              return;
            }
          """
          text = replace_once(text, old, new, 'native error handling')

          pattern = re.compile(r"  @override\n  void dispose\(\) \{.*?\n    super\.dispose\(\);\n  \}", re.S)
          replacement = """  @override
          void dispose() {
            _cancelInitialization();
            _positionTicker?.cancel();
            _fallbackClock.stop();
            ++_generation;
            _releaseCurrentController();
            super.dispose();
          }"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'dispose replacement count={count}')

          text = replace_once(
              text,
              """            builder: (context, value, child) {
                        final duration = _effectiveDuration();
          """,
              """            builder: (context, value, child) {
                        if (value.hasError) return _buildPlayerError();
                        final duration = _effectiveDuration();
          """,
              'builder native error state',
          )

          text = replace_once(
              text,
              """            Text(
                        l10n.videoCannotPlay,
                        style: const TextStyle(color: Colors.white70, fontSize: 12),
                      ),
          """,
              """            Text(
                        l10n.videoCannotPlay,
                        style: const TextStyle(color: Colors.white70, fontSize: 12),
                      ),
                      TextButton(
                        onPressed: () => setState(_resetPlayer),
                        child: Text(l10n.reload),
                      ),
          """,
              'retry button',
          )
          write(player_path, text)

          # 5) video_detail_page already contains cy's int videoId wiring, which fully satisfies
          # zh's requirement to identify playback logs. Keep it as-is.

          # Adjust zh tests to the merged ConsumerStateful/HLS-aware player and cy endpoint signature.
          test_path = 'apps/clyven_app/test/network_video_player_test.dart'
          test = read(test_path)
          if "package:flutter_riverpod/flutter_riverpod.dart" not in test:
              test = test.replace(
                  "import 'package:flutter/material.dart';\n",
                  "import 'package:flutter/material.dart';\nimport 'package:flutter_riverpod/flutter_riverpod.dart';\n",
                  1,
              )
          test = test.replace(
              "Widget player({String url = 'https://media.example/video.mp4'}) => MaterialApp(\n",
              "Widget player({String url = 'https://media.example/video.mp4'}) => ProviderScope(\n  child: MaterialApp(\n",
              1,
          )
          test = test.replace("      videoId: '17',\n", "      videoId: null,\n", 1)
          test = test.replace("  ),\n);\n\nvoid main()", "  ),\n);\n\nvoid main()", 1)
          # ProviderScope adds one extra closing parenthesis around MaterialApp.
          marker = """      fallbackDurationSeconds: 60,
                ),
              ),
            );
          """
          # Use a structural regex instead of relying on formatter indentation.
          test = re.sub(
              r"(fallbackDurationSeconds: 60,\n\s*\),\n\s*\),\n);",
              r"\1  ),\n);",
              test,
              count=1,
          )
          write(test_path, test)

          visibility_test = 'server/clyven_backend_server/test/integration/video_visibility_test.dart'
          vt = read(visibility_test)
          if "isPublic: true" not in vt:
              vt = vt.replace(
                  "        durationSeconds: 12,\n",
                  "        durationSeconds: 12,\n        isPublic: true,\n",
                  1,
              )
          write(visibility_test, vt)

          Path('.merge-conflicts-zh.txt').write_text(
              'RESOLVED\n'
              'apps/clyven_app/lib/core/serverpod/serverpod_client_provider.dart\n'
              'apps/clyven_app/lib/features/video/data/repositories/serverpod_video_repository.dart\n'
              'apps/clyven_app/lib/features/video/presentation/pages/video_detail_page.dart\n'
              'apps/clyven_app/lib/features/video/presentation/widgets/network_video_player.dart\n'
              'server/clyven_backend_server/lib/src/endpoints/video_endpoint.dart\n',
              encoding='utf-8',
          )
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: dart pub get

      - name: Format resolved files
        run: |
          dart format \
            apps/clyven_app/lib/core/serverpod/serverpod_client_provider.dart \
            apps/clyven_app/lib/features/video/data/repositories/serverpod_video_repository.dart \
            apps/clyven_app/lib/features/video/presentation/widgets/network_video_player.dart \
            apps/clyven_app/test/network_video_player_test.dart \
            server/clyven_backend_server/lib/src/endpoints/video_endpoint.dart \
            server/clyven_backend_server/test/integration/video_visibility_test.dart

      - name: Analyze Flutter
        working-directory: apps/clyven_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run merged Flutter regression tests
        working-directory: apps/clyven_app
        run: |
          flutter test test/feed_account_switch_test.dart
          flutter test test/serverpod_feed_repository_test.dart
          flutter test test/network_video_player_test.dart

      - name: Analyze backend
        working-directory: server/clyven_backend_server
        run: dart analyze

      - name: Commit resolved all-features merge
