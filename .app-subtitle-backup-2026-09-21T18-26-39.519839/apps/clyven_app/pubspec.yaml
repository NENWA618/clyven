name: clyven_app
description: "Clyven multilingual video and subtitle client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  video_player: 2.13.0
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  video_duration_native: ^0.2.3
  ffmpeg_kit_flutter_new_min: ^3.6.2
  clyven_backend_client:
    path: ../../packages/clyven_backend_client
  serverpod_client: 3.4.11
  serverpod_auth_idp_flutter: 3.4.11
  serverpod_flutter: 3.4.11
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

resolution: workspace
