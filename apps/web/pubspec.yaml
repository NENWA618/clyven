name: glyphora_web
description: Glyphora public Jaspr web client
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  jaspr: ^0.23.4
  jaspr_router: ^0.9.0
  glyphora_backend_client:
    path: ../../packages/backend_client
  glyphora_web_l10n:
    path: ../../packages/web_l10n
  serverpod_auth_core_client: 3.4.11

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: 4.4.19
  flutter_lints: ^6.0.0
  jaspr_builder: ^0.23.4

jaspr:
  mode: client
  flutter: none

resolution: workspace