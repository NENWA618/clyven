<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="scaffolded-by" content="https://github.com/schultek/jaspr">
    <title>Glyphora Admin</title>
    <script>
      /* Shared theme boot (glyphora_web_l10n ThemeToggle): applies the stored or
         system theme before first paint. */
      (function () {
        try {
          var key = 'glyphora-theme';
          var m = /(?:^#|&)theme=(light|dark)(?:&|$)/.exec(location.hash);
          if (m) localStorage.setItem(key, m[1]);
          var saved = localStorage.getItem(key);
          var dark = saved === 'dark' ||
            (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="/studio.css">
    <link rel="stylesheet" href="/admin.css">
    <link rel="stylesheet" href="/admin.light.css">
    <script defer src="/main.client.dart.js"></script>
  </head>
  <body></body>
</html>
