<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="scaffolded-by" content="https://github.com/schultek/jaspr">

        <title>Glyphora Studio</title>

        <!-- Loads the generated CSS file. -->
        <!-- This contains all @css declarations from your components. -->
        <script>
      /* Shared theme boot (glyphora_web_l10n ThemeToggle): applies the stored or
         system theme before first paint. */
      (function () {
        try {
          var key = 'glyphora-theme';
          var m = /(?:^#|&)theme=(light|dark)(?:&|$)/.exec(location.hash);
          if (m) localStorage.setItem(key, m[1]);
          var saved = localStorage.getItem(key);
          var dark = saved === 'dark' ||
            (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="stylesheet" href="/main.css">

        <!-- The generated flutter manifest and bootstrap script -->
        <link rel="manifest" href="/manifest.json">
        <script src="/flutter_bootstrap.js" async></script>

        <!-- Loads and runs the compiled 'main.client.dart' file. -->
        <!-- Can be changed to any other '.client.dart' file inside /lib. -->
        <script defer src="/main.client.dart.js"></script>
        <link rel="stylesheet" href="/studio.css">
        <link rel="stylesheet" href="/studio.dark.css">
    </head>
    <body>
        <!-- Your app component will be inserted here. -->
    </body>
</html>
