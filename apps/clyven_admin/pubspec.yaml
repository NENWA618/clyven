name: clyven_admin
description: Clyven internal administration and subtitle review platform.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  jaspr: ^0.23.4
  jaspr_flutter_embed: ^0.4.11
  jaspr_router: ^0.9.0
  glyphora_language_core:
    git:
      url: https://github.com/chengyang1017/flutter-languages-config.git
      ref: main
  clyven_backend_client:
    path: ../../packages/clyven_backend_client
  serverpod_client: 3.4.11
  serverpod_auth_core_client: 3.4.11

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: 4.4.19
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  jaspr_builder: ^0.23.4

jaspr:
  mode: client
  flutter: none

flutter:
  uses-material-design: true

resolution: workspace
